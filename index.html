<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstructTTS-OPD: Audio Samples</title>
<style>
  :root { --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --bg-soft:#f6f8fa; --ours:#e8f3ff; --ours-line:#4c8bf5; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
         color: var(--fg); margin: 0; line-height: 1.55; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  h2 { font-size: 1.35rem; margin: 40px 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 1.1rem; margin: 28px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .desc { color: var(--muted); margin: 4px 0 12px; }
  .note { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; margin: 16px 0; }
  .note ul { margin: 6px 0 0; padding-left: 20px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; margin-bottom: 8px; }
  th, td { border: 1px solid var(--line); padding: 8px; vertical-align: top; }
  th { background: var(--bg-soft); font-weight: 600; font-size: .92rem; }
  th.ours, td.ours { background: var(--ours); }
  th.ours { border-bottom: 2px solid var(--ours-line); }
  td.prompt { width: 26%; font-size: .9rem; }
  .instr { font-weight: 600; }
  .en { color: var(--muted); font-size: .85rem; }
  .text { margin-top: 6px; }
  audio { width: 100%; height: 36px; }
  .missing { font-size: .8rem; color: #cf222e; }
  table.legend td:first-child { width: 22%; font-weight: 600; }
  .focus { display: inline-block; font-size: .75rem; padding: 1px 8px; margin-bottom: 6px; border-radius: 10px; background: #fff4e5; color: #9a6700; border: 1px solid #f0c674; }
</style>
</head>
<body>
<main>
  <h1>InstructTTS-OPD: Audio Samples</h1>
  <p class="sub">On-Policy Distillation for Multi-Objective Instruction-Following TTS (anonymous submission).</p>

  <h2>Reward analysis: hearing the reward failures</h2>
  <div id="reward-sections"></div>

  <div id="main-sections"></div>

</main>

<script src="samples.js"></script>
<script>
function renderTable(systems, samples) {
  let h = '<table><thead><tr><th style="width:26%">Instruction / Transcript</th>';
  for (const s of systems) h += '<th class="' + (s.ours ? "ours" : "") + '">' + s.name + "</th>";
  h += "</tr></thead><tbody>";
  for (const x of samples) {
    h += '<tr><td class="prompt">';
    if (x.focus) h += '<span class="focus">' + x.focus + '</span>';
    h += '<div class="instr">' + x.instruction + "</div>";
    if (x.instruction_en) h += '<div class="en">' + x.instruction_en + "</div>";
    h += '<div class="text">“' + x.text + "”</div>";
    if (x.text_en) h += '<div class="en">' + x.text_en + "</div>";
    h += "</td>";
    for (const s of systems) {
      const src = "audio/" + x.id + "/" + s.key + ".mp3";
      h += '<td class="' + (s.ours ? "ours" : "") + '"><audio controls preload="none" src="' + src + '"></audio></td>';
    }
    h += "</tr>";
  }
  return h + "</tbody></table>";
}

let html = "";
html += "<h2>System comparison</h2>" + renderTable(SYSTEMS, CATEGORIES.flatMap(c => c.samples.map(x => ({...x, focus: c.focus}))));
document.getElementById("main-sections").innerHTML = html;

html = "";
for (const b of REWARD_BLOCKS) {
  html += "<h3>" + b.title + "</h3><p class='desc'>" + b.desc + "</p>" + renderTable(b.systems, b.samples);
}
document.getElementById("reward-sections").innerHTML = html;
</script>
</body>
</html>
